<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历配置 - AI 简历填表助手</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="resume-editor.css" />
  </head>
  <body class="resume-editor-page">
    <div class="editor-shell">
      <header class="editor-header">
        <div class="editor-header-main">
          <img class="logo-icon" src="icons/icon128.png" alt="AI 简历填表助手图标" />
          <div class="editor-header-copy">
            <h1>简历配置</h1>
          </div>
        </div>
        <div class="editor-toolbar">
          <select id="resumeTemplateSelect" class="template-select" title="当前简历模板"></select>
          <button class="btn btn-outline btn-sm" id="newTemplateBtn" title="新建一个空白简历模板">新建</button>
          <button class="btn btn-outline btn-sm" id="duplicateTemplateBtn" title="复制当前模板">复制</button>
          <button class="btn btn-outline btn-sm" id="renameTemplateBtn" title="重命名当前模板">重命名</button>
          <button class="btn btn-outline btn-sm" id="deleteTemplateBtn" title="删除当前模板">删除</button>
          <button class="btn btn-outline btn-sm" id="exportTemplatesBtn" title="导出全部模板为 JSON 备份">导出</button>
          <button class="btn btn-outline btn-sm" id="importTemplatesBtn" title="从 JSON 备份导入（覆盖当前模板）">导入</button>
          <button class="btn btn-outline btn-sm" id="exportResumeJsonBtn" title="导出当前资料库 JSON">导出当前简历</button>
          <button class="btn btn-outline btn-sm" id="importResumeJsonBtn" title="导入资料库 JSON 到当前模板">导入当前简历</button>
          <button class="btn btn-outline" id="reloadResumeBtn">重新加载</button>
          <button class="btn btn-outline btn-clear-resume" id="clearResumeBtn" title="清空当前模板的全部分组、条目和字段；Markdown 资料保留">清空当前资料</button>
          <button class="btn btn-primary" id="saveResumeBtn">保存资料</button>
        </div>
      </header>

      <main class="editor-main">
        <div class="tip" id="pageStatus">正在加载资料库...</div>
        <div class="resume-editor-layout resume-editor-layout-wide">
          <aside class="resume-nav" id="resumeNav"></aside>
          <div class="resume-form-host" id="resumeFormHost"></div>
        </div>

        <section class="editor-import-section markdown-panel" id="markdownDocumentPanel" aria-labelledby="markdownPanelTitle">
          <div class="editor-import-header">
            <h2 class="editor-import-title" id="markdownPanelTitle">Markdown 资料</h2>
          </div>
          <div class="editor-import-body">
            <!-- <p class="tip">在此编辑并保存当前模板的 Markdown。侧边栏的 Markdown＋AI 填写只读取已保存内容；AI 解析生成的字段需核对预览后另行保存。</p> -->
            <div class="markdown-input-group">
              <label for="markdownEditor">Markdown 内容</label>
              <textarea id="markdownEditor" class="textarea" rows="18" spellcheck="false" placeholder="# 个人资料"></textarea>
            </div>
            <div class="markdown-editor-footer">
              <p id="markdownStatus" class="markdown-status" role="status"></p>
              <div class="action-row markdown-document-actions">
                <button type="button" id="saveMarkdownBtn" class="btn btn-primary">保存 Markdown</button>
                <button type="button" id="reloadMarkdownBtn" class="btn btn-outline">重新加载</button>
                <button type="button" id="importMarkdownBtn" class="btn btn-outline">导入 .md</button>
                <button type="button" id="exportMarkdownBtn" class="btn btn-outline">导出 .md</button>
              </div>
            </div>
            <div class="action-row markdown-analysis-actions">
              <button type="button" id="convertMarkdownBtn" class="btn btn-primary">AI 解析并添加到资料库</button>
              <button type="button" id="enrichAliasesBtn" class="btn btn-outline">AI 补充别名</button>
              <button type="button" class="btn btn-outline" id="uploadPdfBtn">上传 PDF 并解析</button>
            </div>
            <input type="file" id="resumePdfFile" accept="application/pdf" hidden />
            <input type="file" id="importMarkdownFile" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
          </div>
        </section>

        <div class="alias-preview-host" id="aliasPreviewHost"></div>
      </main>
    </div>

    <input type="file" id="importTemplatesFile" accept="application/json" hidden />
    <input type="file" id="importResumeJsonFile" accept="application/json" hidden />

    <div class="modal" id="templateNameModal">
      <div class="modal-backdrop" id="closeTemplateNameBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="templateNameModalTitle">新建模板</h3>
          <button class="icon-btn" id="closeTemplateNameBtn">
            <svg
              width="20"
              height="20"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="templateNameInput">模板名称</label>
            <input
              type="text"
              id="templateNameInput"
              placeholder="例如：测开 / 游戏开发 / 普通开发"
            />
          </div>
          <div class="config-status" id="templateNameStatus"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary btn-block" id="saveTemplateNameBtn">保存</button>
        </div>
      </div>
    </div>

    <script src="libs/pdfjs/pdf.min.js"></script>
    <script src="shared/resume-schema.js"></script>
    <script src="shared/resume-storage.js"></script>
    <script src="shared/model-storage.js"></script>
    <script src="shared/ai-client.js"></script>
    <script src="shared/resume-prompts.js"></script>
    <script src="shared/custom-fields-editor.js"></script>
    <script src="shared/alias-enrichment.js"></script>
    <script src="shared/library-import.js"></script>
    <script src="shared/markdown-storage.js"></script>
    <script src="shared/markdown-editor.js"></script>
    <script src="resume-editor.js"></script>
  </body>
</html>
